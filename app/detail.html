<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grutto</title>
<meta name="description" content="A running coach that plans the week your feet can take.">
<meta property="og:title" content="Grutto">
<meta property="og:description" content="Your watch scores effort. Your feet count landings. Grutto plans the week from what the watch misses.">
<meta property="og:image" content="../assets/og.png">
<meta property="og:type" content="website">
<style>
/* Tokens. Dark is the default. Light is a second palette, not an inversion. */
:root {
  --bg:#0A0B0D; --s1:#0F1114; --s2:#14171B; --s3:#1A1E23; --s4:#22272E; --s5:#2B313A;
  --line:#1E2329; --line-2:#2C333C; --line-3:#3A424D;
  --t4:#4B5461; --t3:#7C8794; --t2:#B3BBC6; --t1:#EDF0F4; --t0:#FFFFFF;
  --ok:#3DB874; --ok-bg:rgba(61,184,116,0.12); --ok-line:rgba(61,184,116,0.35);
  --warn:#E0A63A; --warn-bg:rgba(224,166,58,0.12); --warn-line:rgba(224,166,58,0.35);
  --stop:#E5544C; --stop-bg:rgba(229,84,76,0.12); --stop-line:rgba(229,84,76,0.4);
  --watch:#6C9BEC; --watch-bg:rgba(108,155,236,0.12); --watch-line:rgba(108,155,236,0.4);
  --accent:#DC5A3A; --accent-bg:rgba(220,90,58,0.14); --accent-line:rgba(220,90,58,0.45);
  --bar:#3A4350; --bar-2:#4A5566; --grid:rgba(255,255,255,0.05); --grid-2:rgba(255,255,255,0.09);
  --shadow-1:0 1px 2px rgba(0,0,0,0.4); --shadow-2:0 8px 24px rgba(0,0,0,0.45),0 1px 2px rgba(0,0,0,0.5);
  --inset:inset 0 1px 0 rgba(255,255,255,0.025); --focus:0 0 0 2px var(--bg),0 0 0 4px var(--accent);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r-1:4px; --r-2:6px; --r-3:10px; color-scheme:dark;
}
[data-theme="light"] {
  --bg:#F2F1EE; --s1:#F8F7F5; --s2:#FFFFFF; --s3:#F5F4F1; --s4:#ECEAE6; --s5:#E1DED8;
  --line:#E5E2DD; --line-2:#D5D1CA; --line-3:#BFB9B0;
  --t4:#B4ADA3; --t3:#7B746B; --t2:#4A443D; --t1:#17140F; --t0:#000000;
  --ok:#1F8A55; --ok-bg:rgba(31,138,85,0.10); --ok-line:rgba(31,138,85,0.35);
  --warn:#B3771A; --warn-bg:rgba(179,119,26,0.10); --warn-line:rgba(179,119,26,0.35);
  --stop:#C93A31; --stop-bg:rgba(201,58,49,0.09); --stop-line:rgba(201,58,49,0.4);
  --watch:#3468CF; --watch-bg:rgba(52,104,207,0.09); --watch-line:rgba(52,104,207,0.4);
  --accent:#C4553A; --accent-bg:rgba(196,85,58,0.12); --accent-line:rgba(196,85,58,0.45);
  --bar:#C9C4BB; --bar-2:#B1ABA1; --grid:rgba(0,0,0,0.06); --grid-2:rgba(0,0,0,0.10);
  --shadow-1:0 1px 2px rgba(30,25,15,0.08); --shadow-2:0 8px 24px rgba(30,25,15,0.10),0 1px 2px rgba(30,25,15,0.08);
  --inset:inset 0 1px 0 rgba(255,255,255,0.6); color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"cv11" 1}
a{color:inherit} button,input,textarea,select{font:inherit;color:inherit} button{cursor:pointer} svg{display:block}
::selection{background:var(--accent-bg)} :focus-visible{outline:none;box-shadow:var(--focus)}
img{max-width:100%;display:block}

/* Type scale: 11 / 12 / 13 / 14 / 16 / 18 / 22 / 30 / 44 */
.t-cap{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.t-meta{font-size:12px;color:var(--t3)} .t-sm{font-size:13px}
.t-lead{font-size:16px;line-height:1.5;color:var(--t2)}
.t-title{font-size:18px;font-weight:600;letter-spacing:-.01em}
.t-h2{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.t-disp{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.t-hero{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1}
.mono{font-family:var(--mono);font-size:12px} .muted{color:var(--t3)} .dim{color:var(--t2)}
.ok{color:var(--ok)} .warn{color:var(--warn)} .stop{color:var(--stop)} .watchc{color:var(--watch)} .acc{color:var(--accent)}

/* Shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.nav{position:sticky;top:0;height:100vh;background:var(--s1);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(160deg,var(--accent) 0%,#9E4224 100%);display:grid;place-items:center;box-shadow:var(--shadow-1),var(--inset)}
.brand-mark svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font-weight:600;font-size:15px;letter-spacing:-.01em} .brand-sub{font-size:11px;color:var(--t3);margin-top:1px}
.runner{margin:0 0 12px;padding:10px;background:var(--s2);border:1px solid var(--line);border-radius:var(--r-2);display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;box-shadow:var(--inset)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--s4);border:1px solid var(--line-2);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--t2)}
.runner .name{font-size:13px;font-weight:600} .runner .state{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:5px;margin-top:1px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--t4);display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.stop{background:var(--stop)} .dot.watch{background:var(--watch)}
.dot.pulse{animation:pulse 2s infinite} @keyframes pulse{0%{box-shadow:0 0 0 0 var(--stop-line)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.nav-sec{padding:10px 8px 4px} .nav-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav-item{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-2);color:var(--t2);font-size:13px;font-weight:500;text-decoration:none;position:relative;border:1px solid transparent}
.nav-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--t3)}
.nav-item:hover{background:var(--s3);color:var(--t1)}
.nav-item.active{background:var(--s3);color:var(--t1);border-color:var(--line);box-shadow:var(--inset)} .nav-item.active svg{color:var(--t1)}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent)}
.nav-item .k{font-family:var(--mono);font-size:10px;color:var(--t4);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;line-height:15px}
.nav-foot{margin-top:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.status-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--t3)}
.status-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;background:var(--s3);border:1px solid var(--line-2);font-size:11px;font-weight:500;color:var(--t2)}
.status-pill.live .dot{background:var(--ok)} .status-pill.rec .dot{background:var(--warn)}
.theme-toggle{display:grid;grid-template-columns:1fr 1fr;padding:2px;gap:2px;background:var(--s3);border:1px solid var(--line-2);border-radius:var(--r-2)}
.theme-toggle button{display:flex;align-items:center;justify-content:center;gap:6px;padding:5px 0;border:0;background:transparent;color:var(--t3);border-radius:4px;font-size:12px}
.theme-toggle button svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.theme-toggle button.on{background:var(--s4);color:var(--t1);box-shadow:var(--shadow-1),var(--inset)}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:5;height:52px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t3)} .crumb b{color:var(--t1);font-weight:600} .crumb .sep{color:var(--t4)}
.topbar-r{display:flex;align-items:center;gap:8px}
.content{padding:24px 28px 64px;max-width:1360px}
.view{display:none} .view.active{display:block;animation:fade 180ms ease-out}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:4px 0 18px} .view-head p{margin:6px 0 0;max-width:720px}

/* Layout primitives */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--s2);border:1px solid var(--line);border-radius:var(--r-3);box-shadow:var(--shadow-1),var(--inset);display:flex;flex-direction:column;min-width:0}
.card.raised{box-shadow:var(--shadow-2),var(--inset)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.card-h .t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.card-h .t svg{width:14px;height:14px;stroke:var(--t3);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card-h .m{font-size:12px;color:var(--t3);display:flex;align-items:center;gap:10px}
.card-b{padding:16px;flex:1} .card-b.tight{padding:0;overflow-x:auto}
.card-f{padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--t3);background:var(--s1);border-radius:0 0 var(--r-3) var(--r-3);line-height:1.45}
.hr{height:1px;background:var(--line);margin:14px 0}
.props{display:flex;align-items:stretch;background:var(--s2);border:1px solid var(--line);border-radius:var(--r-3);box-shadow:var(--shadow-1),var(--inset);overflow:hidden;margin-bottom:16px}
.prop{flex:1;padding:10px 16px;border-right:1px solid var(--line);min-width:0} .prop:last-child{border-right:0}
.prop .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);white-space:nowrap}
.prop .v{font-size:15px;font-weight:600;margin-top:3px;display:flex;align-items:baseline;gap:6px;white-space:nowrap} .prop .v small{font-size:12px;font-weight:500;color:var(--t3)}

/* Badges, chips, segmented, buttons, inputs */
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:var(--r-1);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--t2);background:var(--s3);white-space:nowrap}
.badge .dot{width:6px;height:6px}
.badge.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)} .badge.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.badge.stop{color:var(--stop);background:var(--stop-bg);border-color:var(--stop-line)}
.badge.watch{color:var(--watch);background:var(--watch-bg);border-color:var(--watch-line);font-family:var(--mono);letter-spacing:.04em}
.badge.acc{color:var(--accent);background:var(--accent-bg);border-color:var(--accent-line)}
.badge.lg{font-size:12px;padding:4px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-2);font-size:12px;font-weight:500;background:var(--s3);border:1px solid var(--line-2);color:var(--t2)}
.chip.sel{background:var(--s4);border-color:var(--line-3);color:var(--t1);box-shadow:var(--inset)}
.chip svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip.stop.sel{border-color:var(--stop-line);color:var(--stop);background:var(--stop-bg)}
.seg{display:inline-flex;padding:2px;gap:2px;background:var(--s3);border:1px solid var(--line-2);border-radius:var(--r-2)}
.seg button{border:0;background:transparent;color:var(--t3);font-size:12px;font-weight:500;padding:4px 10px;border-radius:4px;display:inline-flex;align-items:center;gap:6px}
.seg button svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg button.on{background:var(--s4);color:var(--t1);box-shadow:var(--shadow-1),var(--inset)} .seg button:hover:not(.on){color:var(--t2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--r-2);font-size:13px;font-weight:500;border:1px solid var(--line-2);background:var(--s3);color:var(--t1);box-shadow:var(--shadow-1),var(--inset);white-space:nowrap;text-decoration:none}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--s4)}
.btn.primary{background:var(--t1);color:var(--bg);border-color:transparent} .btn.primary:hover{background:var(--t0)} .btn.primary:disabled{opacity:.5;cursor:default}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--t3)} .btn.ghost:hover{background:var(--s3);color:var(--t1)}
.field{display:flex;flex-direction:column;gap:6px} .field label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.input,textarea.input{width:100%;background:var(--s1);border:1px solid var(--line-2);border-radius:var(--r-2);padding:8px 10px;font-size:13px;color:var(--t1);box-shadow:var(--inset)}
.input:focus{border-color:var(--line-3);box-shadow:var(--focus)} textarea.input{resize:vertical;min-height:84px;line-height:1.5} .input::placeholder{color:var(--t4)}
input[type="date"].input{font-family:var(--mono);font-size:12px}
.help{font-size:12px;color:var(--t3);line-height:1.4}

/* Tables and key/value */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--s1);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap} .tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--s3)} .tbl .r{text-align:right} .tbl .mono{color:var(--t2)} .tbl td.k{color:var(--t3)} .tbl tr.hl td{background:var(--stop-bg)}
.tbl .bar-cell{width:120px} .mini-bar{height:4px;background:var(--s4);border-radius:2px;overflow:hidden} .mini-bar i{display:block;height:100%;background:var(--bar-2)}
.mini-bar i.stop{background:var(--stop)} .mini-bar i.warn{background:var(--warn)} .mini-bar i.ok{background:var(--ok)}
.kv{display:flex;flex-direction:column} .kv>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv>div:last-child{border-bottom:0} .kv .k{color:var(--t3)} .kv .v{font-weight:600;display:flex;align-items:baseline;gap:6px} .kv .v small{font-weight:400;color:var(--t3);font-size:12px}
.reasons{display:flex;flex-direction:column}
.reason{display:grid;grid-template-columns:28px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start} .reason:first-child{border-top:0;padding-top:0}
.reason .ic{width:28px;height:28px;border-radius:var(--r-2);display:grid;place-items:center;background:var(--s3);border:1px solid var(--line-2)}
.reason .ic svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.reason .ic.stop{color:var(--stop);background:var(--stop-bg);border-color:var(--stop-line)} .reason .ic.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.reason .ic.watch{color:var(--watch);background:var(--watch-bg);border-color:var(--watch-line)} .reason .ic.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.reason .tt{font-size:14px;font-weight:600} .reason .dd{font-size:13px;color:var(--t2);margin-top:2px;line-height:1.45}
.reason .val{font-size:20px;font-weight:600;letter-spacing:-.02em;text-align:right;line-height:1;padding-top:3px} .reason .val small{display:block;font-size:11px;font-weight:500;color:var(--t3);margin-top:4px;letter-spacing:0}

/* Timeline rail */
.rail{position:relative;display:flex;flex-direction:column}
.rail-step{display:grid;grid-template-columns:24px 1fr auto;gap:12px;position:relative;padding:0 0 18px} .rail-step:last-child{padding-bottom:0}
.rail-step::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line-2)} .rail-step:last-child::before{display:none}
.rail-node{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--s3);border:1px solid var(--line-2);font-size:11px;font-weight:600;color:var(--t3);font-family:var(--mono)}
.rail-node svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rail-step.now .rail-node{background:var(--stop-bg);border-color:var(--stop);color:var(--stop)}
.rail-step.done .rail-node{background:var(--s4);border-color:var(--line-3);color:var(--t1)}
.rail-step.refused .rail-node,.rail-step.stopped .rail-node{background:var(--stop-bg);border-color:var(--stop-line);color:var(--stop)}
.rail-step.approved .rail-node{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.rail-step.locked{opacity:.55}
.rail-step .tt{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap} .rail-step .dd{font-size:13px;color:var(--t2);margin-top:2px;line-height:1.45}
.rail-step .rv{font-size:13px;font-weight:600;text-align:right;white-space:nowrap;color:var(--t2)} .rail-step .rv small{display:block;font-size:11px;color:var(--t3);font-weight:500}

/* Checklist, week strip */
.check{display:flex;flex-direction:column}
.check label{display:grid;grid-template-columns:16px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer;color:var(--t2)} .check label:first-child{border-top:0}
.check input{appearance:none;width:16px;height:16px;border:1px solid var(--line-3);border-radius:4px;background:var(--s1);margin:0;display:grid;place-items:center}
.check input:checked{background:var(--t1);border-color:var(--t1)}
.check input:checked::after{content:"";width:8px;height:5px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.check input:checked+span{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--t4)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid var(--line);border-radius:var(--r-2);padding:8px 6px;text-align:center;background:var(--s1)}
.day .n{font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--t3);text-transform:uppercase} .day .d{font-size:15px;font-weight:600;margin-top:2px}
.day .v{font-size:11px;color:var(--t3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.today{border-color:var(--accent-line);background:var(--s3);box-shadow:var(--inset)} .day.today .n{color:var(--accent)} .day.rest .v{color:var(--t4)}

/* Photo */
.photo{position:relative;overflow:hidden;background:var(--s3)}
.photo img{width:100%;height:100%;object-fit:cover}
.photo.fail{display:none}

/* Utilities */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOWS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); }
function fmtD(s) { const d = pd(s); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; }
function fmtDL(s) { const d = pd(s); return `${DOWS[(d.getUTCDay() + 6) % 7]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; }
function fmtDF(s) { const d = pd(s); return `${DOWL[d.getUTCDay()]} ${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }
function addDays(s, n) { const d = pd(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function daysBetween(a, b) { return Math.round((pd(b) - pd(a)) / 86400000); }
const km = m => m / 1000;
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const f0 = n => Math.round(n).toString();
function pace(distM, durS) { const spk = durS / (distM / 1000); const m = Math.floor(spk / 60), s = Math.round(spk % 60); return `${m}:${String(s).padStart(2, '0')}`; }
const paceFromSpeed = mps => pace(1000, 1000 / mps);
function dur(s) { const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}` : `${m}:${String(ss).padStart(2, '0')}`; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lin = (d0, d1, r0, r1) => v => r0 + (v - d0) / (d1 - d0) * (r1 - r0);
const NS = 'http://www.w3.org/2000/svg';
function S(tag, attrs = {}, kids = []) { const e = document.createElementNS(NS, tag); for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]); for (const c of kids) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); return e; }
function T(x, y, text, attrs = {}) { return S('text', Object.assign({x, y, 'font-size': 11, fill: 'var(--t3)'}, attrs), [String(text)]); }
function zoneOf(hr, ceil) { return hr <= ceil ? 'easy' : hr > ceil + 21 ? 'hard' : 'moderate'; }
const ZONE = {easy: {c: 'ok', l: 'Easy'}, moderate: {c: 'warn', l: 'Moderate'}, hard: {c: 'stop', l: 'Hard'}};
const FLAG = {ok: {c: 'ok', l: 'Ok'}, caution: {c: 'warn', l: 'Caution'}, high: {c: 'stop', l: 'Refuse'}, 'very low': {c: '', l: 'Low'}};
function flagBadge(flag, kmv) {
  if (flag == null) return '<span class="badge" style="opacity:.55">No baseline</span>';
  if (flag === 'very low' && kmv === 0) return '<span class="badge" style="opacity:.7">Empty week</span>';
  const f = FLAG[flag] || {c: '', l: flag}; return `<span class="badge ${f.c}">${f.l}</span>`;
}
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('grutto.' + k)); localStorage.setItem('grutto.' + k, JSON.stringify(v)); } catch (e) { return null; } }
function photo(name, cls, cap) { return `<div class="photo ${cls || ''}"><img src="${ASSETS}${name}" alt="" loading="lazy" onerror="this.parentNode.classList.add('fail')">${cap ? `<span class="cap">${cap}</span>` : ''}</div>`; }

const tipEl = $('#tip');
function tipMove(ev) { const pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight; let x = ev.clientX + pad, y = ev.clientY + pad; if (x + w > innerWidth - 8) x = ev.clientX - w - pad; if (y + h > innerHeight - 8) y = ev.clientY - h - pad; tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; }
function bindTip(el, htmlFn) { el.addEventListener('pointerenter', e => { tipEl.innerHTML = htmlFn(); tipEl.classList.add('on'); tipMove(e); }); el.addEventListener('pointermove', tipMove); el.addEventListener('pointerleave', () => tipEl.classList.remove('on')); }

async function fetchJSON(path, opts = {}, timeoutMs = 5000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeoutMs);
  try { const r = await fetch(API_BASE + path, Object.assign({signal: ctl.signal, headers: {'Content-Type': 'application/json'}}, opts)); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
function setSource(mode) {
  app.source = mode;
  const pill = $('#api-pill');
  pill.className = 'status-pill ' + (mode === 'live' ? 'live' : mode === 'recorded' ? 'rec' : '');
  $('#api-pill-t').textContent = mode === 'live' ? 'Live' : mode === 'recorded' ? 'Recorded' : 'Checking';
  pill.title = mode === 'live' ? 'Reading from the server at ' + (API_BASE || location.origin) : mode === 'recorded' ? 'The server is not reachable. Showing the response recorded on 14 Sep 2026.' : 'Checking the server';
  $('#topbar-meta').textContent = mode === 'recorded' ? 'Recorded response, 14 Sep 2026' : mode === 'live' ? 'Live from the Garmin record' : '';
}
async function loadState() {
  setSource('checking');
  try { const s = await fetchJSON('/api/state'); if (!s || !s.weeks || !s.runs) throw new Error('bad shape'); app.state = s; setSource('live'); }
  catch (e) { app.state = FALLBACK_STATE; setSource('recorded'); }
  renderRunner(); renderView(app.view);
}

function derived(s) {
  const r = s.runner;
  const runs = s.runs.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  const last = runs[runs.length - 1];
  const highWeeks = s.weeks.filter(w => w.flag === 'high');
  const emptyWeeks = s.weeks.filter(w => w.km === 0);
  const longest = runs.reduce((a, b) => km(b.distance_m) > km(a.distance_m) ? b : a, runs[0]);
  const totalKm = runs.reduce((a, b) => a + km(b.distance_m), 0);
  return {runs, last, raceDays: daysBetween(TODAY, r.goal_race_date), highWeeks, emptyWeeks, longest, totalKm, stopDate: addDays(last.date, 1), nextCeiling: Math.round(s.ceiling_km * 1.3 * 10) / 10};
}
function weekOf(date) { return app.state.weeks.find(w => date >= w.week_starting && date <= addDays(w.week_starting, 6)); }

  const r = app.state.runner;
  $('#runner-name').textContent = r.name; $('#runner-avatar').textContent = r.name.slice(0, 1).toUpperCase();

  $('#crumb-date').textContent = fmtDF(TODAY);
}

  const saved = store('checks') || {};

  $('#ceil-bar').innerHTML = `<div class="fill" style="width:${pct(s.weeks[s.weeks.length - 1].km)}"></div><div class="mark" style="left:${pct(s.ceiling_km)}"></div><div class="mark warn" style="left:${pct(d.nextCeiling)}"></div><div class="mark mute" style="left:${pct(s.chronic_km)}"></div>`;
  $('#ceil-lab').innerHTML = `<span class="l row2">0 km run</span><span style="left:${pct(s.ceiling_km)}" class="stop r">${f1(s.ceiling_km)} first week</span><span style="left:${pct(d.nextCeiling)}" class="warn l">${f1(d.nextCeiling)} week two</span><span style="left:${pct(s.chronic_km)}" class="r row2">${f1(s.chronic_km)} average</span><span class="r row2" style="left:100%">${f1(maxKm)} km</span>`;
  const draw = () => drawRaceBar($('#race-bar'), s, d); chartRenderers.push(draw); draw();
}
function drawRaceBar(host, s, d) {

  svg.appendChild(S('rect', {x: 8, y: 30, width: W - 16, height: 8, rx: 2, fill: 'var(--s4)'}));
  svg.appendChild(S('rect', {x: 8, y: 30, width: x(s.race.longest_ever_km) - 8, height: 8, rx: 2, fill: 'var(--bar-2)'}));
  svg.appendChild(S('rect', {x: 8, y: 30, width: x(s.chronic_km) - 8, height: 8, rx: 2, fill: 'var(--t2)'}));
  const tick = (v, label, sub, color, anchor, row) => { svg.appendChild(S('line', {x1: x(v), x2: x(v), y1: 24, y2: row ? 60 : 44, stroke: color, 'stroke-width': 2})); svg.appendChild(T(x(v), row ? 78 : 16, label + ', ' + sub, {'text-anchor': anchor, fill: color, 'font-weight': 600})); };
  tick(s.chronic_km, `${f1(s.chronic_km)} km`, 'an average week', 'var(--t2)', 'end', 1);
  tick(s.race.longest_ever_km, `${f1(s.race.longest_ever_km)} km`, 'longest ever, ' + fmtD(d.longest.date), 'var(--t1)', 'middle', 0);

  host.innerHTML = ''; host.appendChild(svg);
}

function drawCaseChart(host, s, d) {
  const W = Math.max(host.clientWidth, 640), H = 486, m = {l: 44, r: 48, t: 30, b: 134};
  const plotW = W - m.l - m.r, plotH = H - m.t - m.b, plotB = m.t + plotH;
  const weeks = s.weeks.slice();
  const raceWeekStart = (() => { const rd = pd(s.runner.goal_race_date); return addDays(s.runner.goal_race_date, -((rd.getUTCDay() + 6) % 7)); })();
  const cols = weeks.map(w => ({...w})); let cursor = addDays(weeks[weeks.length - 1].week_starting, 7);
  while (cursor <= raceWeekStart) { cols.push({week_starting: cursor, km: null, ratio: null, flag: null, ghost: true}); cursor = addDays(cursor, 7); }
  const n = cols.length, band = plotW / n, bw = Math.min(band * 0.58, 40);
  const maxKm = Math.ceil(Math.max(...weeks.map(w => w.km)) / 5) * 5 + 5, y = lin(0, maxKm, plotB, m.t);
  const maxR = 2.5, yr = lin(0, maxR, plotB, m.t);
  const xc = i => m.l + band * i + band / 2;
  const xDate = date => m.l + daysBetween(cols[0].week_starting, date) / 7 * band + band / 14;
  const svg = S('svg', {width: W, height: H, viewBox: `0 0 ${W} ${H}`}), g = S('g'); svg.appendChild(g);

  g.appendChild(S('rect', {x: m.l, y: yr(1.5), width: plotW, height: yr(1.3) - yr(1.5), fill: 'var(--warn-bg)'}));
  g.appendChild(S('rect', {x: m.l, y: m.t, width: plotW, height: yr(1.5) - m.t, fill: 'var(--stop-bg)', opacity: 0.55}));
  const hlLayer = S('g'); g.appendChild(hlLayer);
  for (let v = 0; v <= maxKm; v += 5) { g.appendChild(S('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: v === 0 ? 'var(--line-3)' : 'var(--grid)'})); g.appendChild(T(m.l - 8, y(v) + 4, v, {'text-anchor': 'end', 'font-family': 'var(--mono)'})); }
  g.appendChild(T(m.l - 8, m.t - 12, 'km', {'text-anchor': 'end', 'font-weight': 600}));
  for (let v = 0.5; v <= maxR; v += 0.5) g.appendChild(T(W - m.r + 8, yr(v) + 4, v.toFixed(1), {'font-family': 'var(--mono)', fill: v === 1.5 ? 'var(--stop)' : 'var(--t3)', 'font-weight': v === 1.5 ? 600 : 400}));
  g.appendChild(T(W - m.r + 8, m.t - 12, 'ratio', {'font-weight': 600}));
  g.appendChild(S('line', {x1: m.l, x2: W - m.r, y1: yr(1.5), y2: yr(1.5), stroke: 'var(--stop)', 'stroke-dasharray': '4 4', 'stroke-width': 1.2}));
  g.appendChild(S('line', {x1: m.l, x2: W - m.r, y1: yr(1.3), y2: yr(1.3), stroke: 'var(--warn)', 'stroke-dasharray': '2 4', opacity: 0.8}));
  g.appendChild(T(m.l + 6, yr(1.5) - 5, 'refused above 1.5', {fill: 'var(--stop)', 'font-weight': 600}));
  g.appendChild(T(W - m.r - 6, yr(1.3) + 12, 'caution from 1.3', {fill: 'var(--warn)', 'text-anchor': 'end'}));

  cols.forEach((w, i) => {
    const cx = xc(i);
    if (w.ghost) { g.appendChild(S('rect', {x: cx - bw / 2, y: m.t, width: bw, height: plotH, fill: 'none', stroke: 'var(--line-2)', 'stroke-dasharray': '3 3', rx: 2})); return; }
    const fill = w.flag === 'high' ? 'var(--stop)' : w.flag === 'caution' ? 'var(--warn)' : 'var(--bar-2)';
    if (w.km > 0) { g.appendChild(S('rect', {x: cx - bw / 2, y: y(w.km), width: bw, height: plotB - y(w.km), fill, rx: 2})); g.appendChild(T(cx, y(w.km) - 6, f1(w.km), {'text-anchor': 'middle', fill: w.flag === 'high' ? 'var(--stop)' : 'var(--t2)', 'font-weight': w.flag === 'high' ? 600 : 500})); }
    else { g.appendChild(S('rect', {x: cx - bw / 2, y: plotB - 3, width: bw, height: 3, fill: 'none', stroke: 'var(--line-3)', 'stroke-dasharray': '2 2'})); g.appendChild(T(cx, plotB - 8, '0', {'text-anchor': 'middle', fill: 'var(--t4)'})); }
  });
  const pts = cols.map((w, i) => w.ratio != null && !w.ghost ? [xc(i), yr(Math.min(w.ratio, maxR))] : null).filter(Boolean);
  g.appendChild(S('path', {d: pts.map((p, i) => (i ? 'L' : 'M') + p[0] + ' ' + p[1]).join(' '), fill: 'none', stroke: 'var(--t1)', 'stroke-width': 1.8, 'stroke-linejoin': 'round'}));
  cols.forEach((w, i) => { if (w.ratio == null || w.ghost) return; const py = yr(Math.min(w.ratio, maxR)); g.appendChild(S('circle', {cx: xc(i), cy: py, r: 3.5, fill: w.ratio >= 1.5 ? 'var(--stop)' : 'var(--bg)', stroke: 'var(--t1)', 'stroke-width': 1.6})); if (w.flag === 'high') { g.appendChild(S('rect', {x: xc(i) + 8, y: py - 20, width: 34, height: 16, rx: 3, fill: 'var(--stop)'})); g.appendChild(T(xc(i) + 25, py - 8, w.ratio.toFixed(1) + '×', {'text-anchor': 'middle', fill: '#fff', 'font-weight': 700, 'font-size': 10.5})); } });

  const xi = xDate(d.stopDate);
  g.appendChild(S('line', {x1: xi, x2: xi, y1: m.t - 4, y2: plotB, stroke: 'var(--stop)', 'stroke-width': 1.2, 'stroke-dasharray': '3 3'}));
  g.appendChild(S('circle', {cx: xi, cy: m.t - 8, r: 3.5, fill: 'var(--stop)'}));

    });

}

let runSort = 'newest';

          </tbody></table>
          <div class="kv" style="margin-top:8px">

}

function drawIntensityChart(host, s, d) {
  const W = Math.max(host.clientWidth, 520), H = 380, m = {l: 44, r: 64, t: 18, b: 34};
  const plotW = W - m.l - m.r, plotH = H - m.t - m.b, plotB = m.t + plotH;
  const ceil = s.intensity.easy_hr_ceiling, hardFrom = ceil + 22;
  const x0 = addDays(d.runs[0].date, -4), x1 = addDays(d.runs[d.runs.length - 1].date, 4);
  const x = v => m.l + daysBetween(x0, v) / daysBetween(x0, x1) * plotW;
  const y = lin(110, 175, plotB, m.t), rScale = v => 3 + Math.sqrt(km(v)) * 2.4;
  const svg = S('svg', {width: W, height: H, viewBox: `0 0 ${W} ${H}`}), g = S('g'); svg.appendChild(g);
  g.appendChild(S('rect', {x: m.l, y: y(ceil), width: plotW, height: plotB - y(ceil), fill: 'var(--ok-bg)'}));
  g.appendChild(S('rect', {x: m.l, y: y(hardFrom), width: plotW, height: y(ceil) - y(hardFrom), fill: 'var(--warn-bg)', opacity: 0.5}));
  g.appendChild(S('rect', {x: m.l, y: m.t, width: plotW, height: y(hardFrom) - m.t, fill: 'var(--stop-bg)', opacity: 0.6}));
  for (let v = 110; v <= 175; v += 10) { g.appendChild(S('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: 'var(--grid)'})); g.appendChild(T(m.l - 8, y(v) + 4, v, {'text-anchor': 'end', 'font-family': 'var(--mono)'})); }
  g.appendChild(T(m.l - 8, m.t - 6, 'bpm', {'text-anchor': 'end', 'font-weight': 600}));
  ['2026-07-01', '2026-08-01', '2026-09-01'].forEach(dt => { if (dt < x0 || dt > x1) return; g.appendChild(S('line', {x1: x(dt), x2: x(dt), y1: m.t, y2: plotB, stroke: 'var(--grid-2)'})); g.appendChild(T(x(dt) + 4, plotB + 16, MONTHS[pd(dt).getUTCMonth()], {'font-weight': 600, fill: 'var(--t2)'})); });
  ['2026-07-15', '2026-08-15'].forEach(dt => g.appendChild(T(x(dt), plotB + 16, '15', {'text-anchor': 'middle'})));
  g.appendChild(S('line', {x1: m.l, x2: W - m.r, y1: plotB, y2: plotB, stroke: 'var(--line-3)'}));
  g.appendChild(S('line', {x1: m.l, x2: W - m.r, y1: y(ceil), y2: y(ceil), stroke: 'var(--ok)', 'stroke-width': 1.6, 'stroke-dasharray': '5 4'}));
  const lab = `easy ceiling ${ceil}`;
  g.appendChild(S('rect', {x: m.l + 6, y: y(ceil) - 20, width: lab.length * 6.4 + 12, height: 16, rx: 3, fill: 'var(--ok)'}));
  g.appendChild(T(m.l + 12, y(ceil) - 8.5, lab, {fill: '#fff', 'font-weight': 700, 'font-size': 10.5}));
  g.appendChild(S('line', {x1: m.l, x2: W - m.r, y1: y(hardFrom), y2: y(hardFrom), stroke: 'var(--stop)', 'stroke-dasharray': '2 4', opacity: 0.8}));
  g.appendChild(T(m.l + 6, y(hardFrom) - 5, `hard from ${hardFrom}`, {fill: 'var(--stop)', 'font-weight': 600}));
  g.appendChild(S('line', {x1: x(d.stopDate), x2: x(d.stopDate), y1: m.t, y2: plotB, stroke: 'var(--stop)', 'stroke-dasharray': '3 3'}));
  g.appendChild(T(x(d.stopDate) - 6, m.t + 10, 'stopped, ' + fmtD(d.stopDate), {'text-anchor': 'end', fill: 'var(--stop)', 'font-weight': 600}));
  const sx = W - m.r + 22;
  g.appendChild(S('line', {x1: sx, x2: sx, y1: m.t, y2: plotB, stroke: 'var(--line-2)'}));
  const cnt = {easy: 0, moderate: 0, hard: 0};
  d.runs.forEach(r => { const z = zoneOf(r.avg_hr, ceil); cnt[z]++; g.appendChild(S('line', {x1: sx - 6, x2: sx + 6, y1: y(r.avg_hr), y2: y(r.avg_hr), stroke: `var(--${ZONE[z].c})`, 'stroke-width': 1.6, opacity: 0.9})); });
  g.appendChild(T(sx, plotB + 16, 'all', {'text-anchor': 'middle'}));
  g.appendChild(T(sx + 12, (y(ceil) + plotB) / 2 + 4, cnt.easy, {fill: 'var(--ok)', 'font-weight': 600, 'font-family': 'var(--mono)'}));
  g.appendChild(T(sx + 12, (y(ceil) + y(hardFrom)) / 2 + 4, cnt.moderate, {fill: 'var(--warn)', 'font-weight': 600, 'font-family': 'var(--mono)'}));

    c.addEventListener('pointerenter', () => c.setAttribute('fill-opacity', 1)); c.addEventListener('pointerleave', () => c.setAttribute('fill-opacity', 0.85));

    g.appendChild(c);
  });
  host.innerHTML = ''; host.appendChild(svg);
}

function renderForm() {

  const spark = (vals, cls) => { const w = 64, h = 22, mn = Math.min(...vals), mx = Math.max(...vals), pad = (mx - mn) || 1; const pts = vals.map((v, i) => [4 + i / (vals.length - 1) * (w - 8), h - 4 - (v - mn) / pad * (h - 8)]); return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--${cls})" stroke-width="1.6" stroke-linejoin="round"/>${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2" fill="var(--${cls})"/>`).join('')}</svg>`; };

        <div class="card-b" style="padding:12px 12px 8px"><div class="chart" id="cad-chart"></div></div>
        <div class="card-f">Only ${rows.length} of ${s.runs.length} runs carry stride measurements, and they were all run at close to the same pace, which is the only fair way to compare them. Five points is a small sample, so treat the direction as early.</div>
      </div></div>

          <div class="card-b tight"><table class="tbl">

function drawCadenceChart(host, s) {
  const W = Math.max(host.clientWidth, 520), H = 306, m = {l: 44, r: 24, t: 28, b: 34};
  const plotW = W - m.l - m.r, plotH = H - m.t - m.b, plotB = m.t + plotH, pts = s.form.cadence;
  const x0 = addDays(pts[0].date, -6), x1 = addDays(pts[pts.length - 1].date, 6);
  const x = v => m.l + daysBetween(x0, v) / daysBetween(x0, x1) * plotW, yMin = 150, yMax = 165, y = lin(yMin, yMax, plotB, m.t);
  const svg = S('svg', {width: W, height: H, viewBox: `0 0 ${W} ${H}`}), g = S('g'); svg.appendChild(g);
  for (let v = yMin; v <= yMax; v += 5) { g.appendChild(S('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: v === yMin ? 'var(--line-3)' : 'var(--grid)'})); g.appendChild(T(m.l - 8, y(v) + 4, v, {'text-anchor': 'end', 'font-family': 'var(--mono)'})); }
  for (let v = yMin + 2.5; v < yMax; v += 5) g.appendChild(S('line', {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: 'var(--grid)', 'stroke-dasharray': '2 4'}));
  g.appendChild(T(m.l - 8, m.t - 14, 'spm', {'text-anchor': 'end', 'font-weight': 600}));
  ['2026-08-01', '2026-09-01'].forEach(dt => { g.appendChild(S('line', {x1: x(dt), x2: x(dt), y1: m.t, y2: plotB, stroke: 'var(--grid-2)'})); g.appendChild(T(x(dt) + 4, plotB + 16, MONTHS[pd(dt).getUTCMonth()], {'font-weight': 600, fill: 'var(--t2)'})); });
  g.appendChild(T(m.l + 4, plotB + 16, MONTHS[pd(x0).getUTCMonth()], {'font-weight': 600, fill: 'var(--t2)'}));
  const xs = pts.map(p => daysBetween(x0, p.date)), ys = pts.map(p => p.value), mx = xs.reduce((a, b) => a + b, 0) / xs.length, my = ys.reduce((a, b) => a + b, 0) / ys.length;
  const slope = xs.reduce((a, xv, i) => a + (xv - mx) * (ys[i] - my), 0) / xs.reduce((a, xv) => a + (xv - mx) ** 2, 0), tl = xv => my + slope * (xv - mx);
  g.appendChild(S('line', {x1: x(pts[0].date), x2: x(pts[pts.length - 1].date), y1: y(tl(xs[0])), y2: y(tl(xs[xs.length - 1])), stroke: 'var(--accent)', 'stroke-dasharray': '5 4', 'stroke-width': 1.4}));
  const ann = `+${s.form.cadence_change.toFixed(1)} spm, ${fmtD(pts[0].date)} to ${fmtD(pts[pts.length - 1].date)}`, aw = ann.length * 6.3 + 14;
  g.appendChild(S('rect', {x: W - m.r - aw, y: m.t - 2, width: aw, height: 18, rx: 3, fill: 'var(--accent-bg)', stroke: 'var(--accent-line)'}));
  g.appendChild(T(W - m.r - 7, m.t + 10.5, ann, {'text-anchor': 'end', fill: 'var(--accent)', 'font-weight': 600}));
  g.appendChild(S('path', {d: pts.map((p, i) => (i ? 'L' : 'M') + x(p.date) + ' ' + y(p.value)).join(' '), fill: 'none', stroke: 'var(--t1)', 'stroke-width': 2, 'stroke-linejoin': 'round'}));
  pts.forEach(p => {
    const fr = FORM_RUNS.find(r => r.date === p.date);
    const c = S('circle', {cx: x(p.date), cy: y(p.value), r: 5, fill: 'var(--bg)', stroke: 'var(--t1)', 'stroke-width': 2, style: 'cursor:crosshair'});
    g.appendChild(T(x(p.date), y(p.value) - 12, p.value.toFixed(1), {'text-anchor': 'middle', fill: 'var(--t1)', 'font-weight': 600}));
    g.appendChild(T(x(p.date), plotB + 30, fmtD(p.date), {'text-anchor': 'middle'}));
    bindTip(c, () => `<div class="th"><span>${fmtDL(p.date)}</span></div><div class="tr"><span>Cadence</span><b>${p.value.toFixed(1)} spm</b></div>${fr ? `<div class="tr"><span>Pace</span><b>${paceFromSpeed(fr.speed_mps)} /km</b></div><div class="tr"><span>Heart rate</span><b>${fr.avg_hr} bpm</b></div><div class="tr"><span>Distance</span><b>${f1(fr.km)} km</b></div>` : ''}`);
    g.appendChild(c);
  });
  host.innerHTML = ''; host.appendChild(svg);
}

async function runPlan() {
  if (app.planRunning) return;
  const request = {question: planForm.question.trim() || 'Plan my week.', as_of: planForm.mode === 'past' ? planForm.asOf : null, pain: planForm.pain === 'other' ? '' : planForm.pain};
  const run = {request, t0: Date.now()}; app.planRunning = run; app.plan = null; $('#pf-run').disabled = true;
  renderPlanLoading(run);
  try {
    const res = await fetchJSON('/api/plan', {method: 'POST', body: JSON.stringify(request)}, 240000);
    if (!res || !res.transcript) throw new Error('bad shape');
    app.planRunning = null;
    const hist = store('runs') || []; hist.unshift({run_id: res.run_id, as_of: request.as_of, outcome: outcomeOf(res), at: new Date().toISOString()}); store('runs', hist.slice(0, 30));
    showPlanResult(res, request, false);
  } catch (e) {
    app.planRunning = null;

    $('#pl-retry').addEventListener('click', runPlan);
    $$('#plan-out [data-replay]').forEach(b => b.addEventListener('click', () => { const p = RECORDED_PLANS[b.dataset.replay]; showPlanResult(p, p.request, true); }));
  } finally { const b = $('#pf-run'); if (b) b.disabled = false; }
}

function saysStop(a) { return /^\s*(do not run|no running|stop)\b/i.test(a || ''); }
function physioStopped(res) { const p = res.transcript.find(t => t.agent === 'physio'); return !!p && (saysStop(p.answer) || !res.transcript.some(t => t.agent === 'plan_writer')); }
function outcomeOf(res) { return physioStopped(res) ? 'stopped' : res.gate && res.gate.approved ? 'approved' : 'refused'; }
function loopFromTranscript(tr) {
  const steps = []; let draft = 0;
  tr.forEach((t, i) => {
    if (t.agent === 'physio') steps.push({kind: saysStop(t.answer) ? 'stopped' : 'cleared', i, t, draft});
    if (t.agent === 'plan_writer') { draft++; steps.push({kind: draft === 1 ? 'proposed' : 'rewritten', i, t, draft}); }
    if (t.agent === 'safety_officer') steps.push({kind: /^\s*REJECT/i.test(t.answer) ? 'refused' : 'approved', i, t, draft});
    if (t.agent === 'publisher') steps.push({kind: 'published', i, t, draft});
  });
  return steps;
}
function summarise(text, n = 150) { const s = text.replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n).replace(/\s\S*$/, '') + '…' : s; }
function stripVerdict(a) { return a.replace(/^\s*(REJECTED|APPROVED|DO NOT RUN|STOP)\.?\s*/i, ''); }

function showPlanResult(res, request, replay, instant = false) {

  const totalKm = (res.plan || []).reduce((a, p) => a + (p.distance_km || 0), 0), asOf = request.as_of;
  const actual = asOf ? s.weeks.find(w => asOf >= w.week_starting && asOf <= addDays(w.week_starting, 6)) : null;
  const stagger = instant ? 0 : 320;
  const status = {};
  res.transcript.forEach(t => { if (t.agent === 'physio') status.physio = saysStop(t.answer) ? 'stopped' : 'done'; else if (t.agent === 'safety_officer') status.safety_officer = /^\s*REJECT/i.test(t.answer) ? 'refused' : 'approved'; else status[t.agent] = 'done'; });
  const nodeText = a => status[a] === 'stopped' ? 'stopped the week' : status[a] === 'refused' ? 'refused a draft' : status[a] === 'approved' ? 'approved' : status[a] ? (a === 'plan_writer' && refusals ? `${refusals + 1} drafts` : 'answered') : stopped ? 'not asked' : 'not reached';
  const nodeIcon = a => status[a] === 'stopped' ? 'hand' : status[a] === 'refused' ? 'x' : status[a] === 'approved' ? 'check' : status[a] ? 'check' : 'lock';
  const physioT = res.transcript.find(t => t.agent === 'physio');

  out.innerHTML = `
    <div class="card raised">
      <div class="card-h">
        <div class="t">${stopped ? '<span class="badge stop"><span class="dot"></span>No week written</span>' : gateOk ? '<span class="badge ok"><span class="dot"></span>Week approved</span>' : '<span class="badge warn"><span class="dot"></span>No approved week</span>'}<span class="t-meta">${replay ? 'recorded run' : 'live run'}</span></div>
        <div class="m"><span class="mono">${esc(res.run_id)}</span><span>${asOf ? 'as of ' + fmtD(asOf) : 'today'}</span>${request.pain ? `<span class="badge stop">pain: ${esc(request.pain)}</span>` : ''}</div>
      </div>
      <div class="card-b" style="padding:12px 16px 8px"><div class="pipe">${AGENT_ORDER.map(a => `<div class="pipe-node ${status[a] || (stopped ? 'skipped' : '')} ${a === 'plan_writer' && refusals ? 'loop' : ''}"><div class="pn">${icon(nodeIcon(a))}</div><div class="pl">${a}</div><div class="ps">${nodeText(a)}</div></div>`).join('')}</div></div>
      <div class="card-f">${stopped ? `The physio ended the run after ${res.transcript.length} agents. The plan writer and safety officer were not asked, so there is no draft and no verdict to show. ` : res.gate ? `${res.gate.attempts} ${res.gate.attempts === 1 ? 'attempt' : 'attempts'}, ${res.gate.rejections.length} ${res.gate.rejections.length === 1 ? 'refusal' : 'refusals'}. ` : ''}${esc(request.question)}</div>
    </div>
    <div class="grid">
      <div class="c7 stack" id="agent-cards"></div>
      <div class="c5 stack">
        ${stopped ? `
        <div class="card" style="border-color:var(--stop-line)">
          <div class="card-h"><div class="t">${icon('hand')}Why there is no week</div><div class="m"><span class="badge stop">physio</span></div></div>
          <div class="card-b">
            <div class="rail">
              <div class="rail-step stopped"><div class="rail-node">${icon('hand')}</div><div><div class="tt">Stopped before writing</div><div class="dd">${esc(summarise(stripVerdict(physioT.answer), 230))}</div></div><div class="rv">0 km<small>this week</small></div></div>
              ${res.transcript.filter(t => t.agent !== 'physio').map(t => `<div class="rail-step done"><div class="rail-node">${icon(AGENTS[t.agent] ? AGENTS[t.agent].icon : 'coach')}</div><div><div class="tt">${AGENTS[t.agent] ? AGENTS[t.agent].label : esc(t.agent)} <span class="t-meta">noted for the return</span></div><div class="dd">${esc(summarise(t.answer, 140))}</div></div><div class="rv"></div></div>`).join('')}
              <div class="rail-step locked"><div class="rail-node">${icon('lock')}</div><div><div class="tt">Nothing drafted</div><div class="dd">Grutto does not write a week in order to refuse it. The plan writer and safety officer wait until the physio clears the runner.</div></div><div class="rv"></div></div>
            </div>
          </div>
          <div class="card-f">Ask again once a physio has seen the feet and two days of walking have gone by without pain.</div>
        </div>
        <div class="card">
          <div class="card-h"><div class="t">${icon('walk')}What opens next</div><div class="m"><a href="#today" style="color:var(--t2)">Full ladder on Today</a></div></div>
          <div class="card-b"><div class="noweek">
            <div><div class="n">Step 1</div><div class="tt">Physio</div><div class="dd">Feet looked at before any running.</div></div>
            <div><div class="n">Step 2</div><div class="tt">Two walks</div><div class="dd">Thirty minutes each, no pain during or after.</div></div>
            <div><div class="n">Step 3</div><div class="tt">First run</div><div class="dd">Walk and run, 3 km at most, under ${s.intensity.easy_hr_ceiling}.</div></div>
          </div>
          <div class="hr"></div>
          <div class="kv">
            <div><span class="k">First week back, at most</span><span class="v stop">${f1(s.ceiling_km)} <small>km</small></span></div>
            <div><span class="k">Four-week average now</span><span class="v">${f1(s.chronic_km)} <small>km</small></span></div>
            <div><span class="k">${esc(s.runner.goal_race)}</span><span class="v">${fmtD(s.runner.goal_race_date)} <small>${esc(s.race.call)}</small></span></div>
          </div></div>
        </div>` : `
        <div class="card">
          <div class="card-h"><div class="t">${icon('shield')}How the week was written</div><div class="m">${refusals ? `${refusals} ${refusals === 1 ? 'refusal' : 'refusals'}` : 'no refusals'}</div></div>
          <div class="card-b"><div class="rail">${loop.map(st => {
            const cls = st.kind === 'refused' ? 'refused' : st.kind === 'approved' || st.kind === 'published' ? 'approved' : 'done';
            const ic = {cleared: 'physio', stopped: 'hand', refused: 'x', approved: 'check', published: 'send', proposed: 'pen', rewritten: 'pen'}[st.kind] || 'coach';
            const title = {cleared: 'Cleared to write', stopped: 'Stopped', proposed: 'Proposed', refused: 'Refused', rewritten: 'Rewritten', approved: 'Approved', published: 'Published'}[st.kind] || st.kind;
            const kmMatch = st.t.answer.match(/(\d+(?:\.\d+)?)\s*km/);
            return `<div class="rail-step ${cls}"><div class="rail-node">${icon(ic)}</div><div><div class="tt">${title} <span class="t-meta">${st.draft ? 'draft ' + st.draft + ', ' : ''}step ${st.i + 1}</span></div><div class="dd">${esc(summarise(stripVerdict(st.t.answer), st.kind === 'refused' ? 220 : 130))}</div></div><div class="rv">${kmMatch && st.draft && st.kind !== 'published' ? `${kmMatch[1]} km` : ''}</div></div>`;
          }).join('')}</div></div>
          ${res.gate && res.gate.rejections && res.gate.rejections.length ? `<div class="card-f"><b class="stop">Refused because:</b> ${res.gate.rejections.map(esc).join(' / ')}</div>` : ''}
        </div>
        ${actual && actual.km > 0 ? `<div class="card">
          <div class="card-h"><div class="t">${icon('jump')}What happened that week</div><div class="m">${fmtD(actual.week_starting)}</div></div>
          <div class="card-b">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
              <div><div class="t-cap">Grutto wrote</div><div class="t-disp ok" style="margin-top:4px">${f0(totalKm)}<span class="t-meta" style="font-size:14px;font-weight:500;margin-left:4px">km</span></div></div>
              <div><div class="t-cap">Actually ran</div><div class="t-disp ${actual.flag === 'high' ? 'stop' : ''}" style="margin-top:4px">${f1(actual.km)}<span class="t-meta" style="font-size:14px;font-weight:500;margin-left:4px">km</span></div></div>
            </div>
            <div class="ceil" style="margin-top:14px"><div class="fill" style="width:${clamp(totalKm / actual.km * 100, 0, 100).toFixed(1)}%;background:var(--ok)"></div><div class="mark" style="left:100%"></div></div>
            <div class="ceil-lab"><span class="l">0</span><span style="left:${clamp(totalKm / actual.km * 100, 0, 100).toFixed(1)}%" class="ok">${f0(totalKm)} approved</span><span class="r stop" style="left:100%">${f1(actual.km)} ran, ${actual.ratio.toFixed(1)}&times;</span></div>
            <p class="help" style="margin:10px 0 0">${actual.flag === 'high' ? `That week was ${actual.ratio.toFixed(1)} times the four before it and the watch scored it fine. ${daysBetween(addDays(actual.week_starting, 6), d.stopDate)} days after it ended, the running stopped with pain in ${esc(s.runner.pain_area)}.` : `That week was ${actual.ratio.toFixed(1)} times the four before it.`}</p>
          </div>
        </div>` : ''}`}
      </div>
    </div>`;

  const cards = $('#agent-cards');
  res.transcript.forEach((t, i) => {
    setTimeout(() => {
      const A = AGENTS[t.agent] || {label: t.agent, icon: 'coach'};
      const st = t.agent === 'physio' ? (saysStop(t.answer) ? 'stopped' : 'cleared') : t.agent === 'safety_officer' ? (/^\s*REJECT/i.test(t.answer) ? 'refused' : 'approved') : '';
      const badge = st === 'stopped' ? '<span class="badge stop">Do not run</span>' : st === 'refused' ? '<span class="badge stop">Refused</span>' : st === 'approved' ? '<span class="badge ok">Approved</span>' : st === 'cleared' ? '<span class="badge ok">Cleared</span>' : '';
      cards.insertAdjacentHTML('beforeend', `
        <div class="card agent" id="ag-${i}">
          <div class="card-h">
            <div class="who"><div class="glyph ${st === 'stopped' || st === 'refused' ? 'stop' : st === 'approved' ? 'ok' : ''}">${icon(A.icon)}</div><div><div class="aname">${A.label} ${badge}</div><div class="aid">${esc(t.agent)} <span class="t-meta">step ${i + 1}</span></div></div></div>
            <div class="m"><button class="btn sm ghost" data-toggle="${i}">${icon('info')}What it was asked</button></div>
          </div>
          <div class="asked">${esc(t.question)}</div>
          <div class="card-b"><div class="ans">${esc(t.answer)}</div></div>
          ${feedbackBar(res.run_id, i)}
        </div>`);
      $(`[data-toggle="${i}"]`).addEventListener('click', () => $(`#ag-${i}`).classList.toggle('open'));
      wireFeedback($(`#ag-${i}`), res.run_id, t.agent, i);
      if (i === res.transcript.length - 1) setTimeout(() => {
        cards.insertAdjacentHTML('beforeend', `
          <div class="card agent raised" id="ag-final" style="border-color:var(--line-3)">
            <div class="card-h"><div class="who"><div class="glyph" style="background:var(--t1);border-color:var(--t1)"><svg viewBox="0 0 24 24" style="stroke:var(--bg)">${ICONS.coach}</svg></div><div><div class="aname">Coach</div><div class="aid">coach <span class="t-meta">the note the runner reads</span></div></div></div><div class="m">${stopped ? '<span class="badge stop">No week</span>' : gateOk ? '<span class="badge ok">Approved week</span>' : '<span class="badge warn">No approved week</span>'}</div></div>
            <div class="card-b">
              <div class="final-note">${esc(res.final).split(/\n\s*\n/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('')}</div>
              ${res.plan && res.plan.length ? `<div class="hr"></div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><div class="t-cap">The week</div><div class="t-meta"><b class="dim">${f0(totalKm)} km</b> across ${res.plan.filter(p => p.distance_km > 0).length} runs</div></div><div class="plan-days">${res.plan.map(p => `<div class="plan-day ${p.distance_km > 0 ? 'run' : 'rest'}"><div class="n">${esc(p.day.slice(0, 3))}</div><div class="km">${p.distance_km > 0 ? p.distance_km : '0'}<small>km</small></div><div class="ds">${esc(p.description)}</div></div>`).join('')}</div>` : stopped ? `<div class="hr"></div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><div class="t-cap">The week</div><div class="t-meta">0 km, seven days</div></div><div class="plan-days">${DOWS.map((n, k) => `<div class="plan-day rest"><div class="n">${n}</div><div class="km">0<small>km</small></div><div class="ds">${k === 0 ? 'See a physio' : 'Walk, if pain free'}</div></div>`).join('')}</div>` : ''}
            </div>
            ${feedbackBar(res.run_id, 999)}
          </div>`);
        wireFeedback($('#ag-final'), res.run_id, 'coach', 999);
      }, stagger);
    }, i * stagger);
  });
}

function feedbackBar(runId, step) {
  const saved = (store('fb') || {})[`${runId}:${step}`];
  return `<div class="fb"><div class="vote"><button class="up ${saved && saved.verdict === 'good' ? 'on' : ''}" title="Good answer">${icon('up')}</button><button class="down ${saved && saved.verdict === 'bad' ? 'on' : ''}" title="Bad answer">${icon('down')}</button></div><div class="note"><input class="input" placeholder="What was wrong or right about this one" value="${esc(saved ? saved.note : '')}"></div><button class="btn sm" data-save>Save</button><span class="saved ${saved ? 'ok' : ''}">${saved ? icon('check') + 'Saved ' + saved.at : ''}</span></div>`;
}
function wireFeedback(card, runId, agent, step) {
  const bar = $('.fb', card); if (!bar) return;
  const up = $('.up', bar), down = $('.down', bar), input = $('input', bar), save = $('[data-save]', bar), status = $('.saved', bar);
  let verdict = up.classList.contains('on') ? 'good' : down.classList.contains('on') ? 'bad' : null;
  const post = async () => {
    if (!verdict) { status.className = 'saved err'; status.innerHTML = icon('info') + 'Pick up or down first'; return; }
    const body = {run_id: runId, agent, verdict, note: input.value.trim(), step};
    status.className = 'saved'; status.innerHTML = '<span class="spin"></span>Saving';
    try {
      const r = await fetchJSON('/api/feedback', {method: 'POST', body: JSON.stringify(body)}, 8000);
      if (!r || !r.ok) throw new Error('not ok');
      const at = new Date().toTimeString().slice(0, 5);
      status.className = 'saved ok'; status.innerHTML = icon('check') + 'Saved ' + at;
      const fb = store('fb') || {}; fb[`${runId}:${step}`] = {verdict, note: body.note, at}; store('fb', fb);
    } catch (e) { status.className = 'saved err'; status.innerHTML = icon('x') + 'Not saved, server down'; }
  };
  up.addEventListener('click', () => { verdict = 'good'; up.classList.add('on'); down.classList.remove('on'); post(); });
  down.addEventListener('click', () => { verdict = 'bad'; down.classList.add('on'); up.classList.remove('on'); input.focus(); });
  save.addEventListener('click', post);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') post(); });
}

/* Boot */
buildNav();
setTheme(new URLSearchParams(location.search).get('theme') || store('theme') || 'dark', false);
loadState().then(() => setView(location.hash.slice(1) || 'today'));
</script>
</body>
