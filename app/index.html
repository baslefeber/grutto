<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grutto</title>
<meta name="description" content="A running coach that is allowed to say no.">
<style>
:root{
  --bg:#0B0C0E; --card:#131518; --line:#20242A; --line2:#2C323A;
  --t1:#F2F4F7; --t2:#A8B0BA; --t3:#6B7683;
  --accent:#E4572E; --ok:#3DB874; --warn:#E0A63A;
  --r:16px;
}
:root[data-theme=light]{
  --bg:#FAF9F7; --card:#FFFFFF; --line:#E7E4DF; --line2:#D8D4CD;
  --t1:#16181B; --t2:#5C646E; --t3:#8A929C;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--t1); min-height:100vh;
  font:400 17px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:32px 24px 96px}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:19px;
       letter-spacing:-.02em}
.brand svg{color:var(--accent);display:block}
.theme{background:none;border:1px solid var(--line);color:var(--t3);cursor:pointer;
       border-radius:999px;padding:6px 13px;font:inherit;font-size:13px}
.theme:hover{color:var(--t1);border-color:var(--line2)}

.tag{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;
     letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.tag i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}

h1{font-size:clamp(38px,7.5vw,58px);line-height:1.03;letter-spacing:-.035em;
   font-weight:680;margin-bottom:26px}

.says{font-size:18px;line-height:1.62;color:var(--t2)}
.says p+p{margin-top:15px}
.says strong{color:var(--t1);font-weight:600}

.facts{display:flex;gap:10px;margin:34px 0 0;flex-wrap:wrap}
.fact{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);
      border-radius:var(--r);padding:15px 17px}
.fact dt{font-size:12px;color:var(--t3);margin-bottom:5px;letter-spacing:.02em}
.fact dd{font-size:23px;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fact dd small{font-size:13.5px;font-weight:400;color:var(--t3);letter-spacing:0}
.fact.hot dd{color:var(--accent)}

.ask{margin-top:40px}
.ask form{display:flex;gap:9px}
.ask input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 16px;font:inherit;font-size:16px;color:var(--t1)}
.ask input:focus{outline:none;border-color:var(--line2)}
.ask input::placeholder{color:var(--t3)}
.ask button{background:var(--accent);border:0;border-radius:12px;padding:13px 22px;
  font:inherit;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap}
.ask button:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.ask .chips .chip{background:none;border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font:inherit;font-size:13.5px;font-weight:400;color:var(--t3);
  cursor:pointer}
.ask .chips .chip:hover{color:var(--t1);border-color:var(--line2)}

.thread{margin-top:26px;display:flex;flex-direction:column;gap:18px}
.you{color:var(--t3);font-size:16.5px;padding-left:2px}
.you b{color:var(--t2);font-weight:500}
.reply{background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:22px 24px}
.reply .who{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);
  margin-bottom:12px;display:flex;align-items:center;gap:8px}
.reply .who svg{color:var(--accent)}
.reply p{color:var(--t2);font-size:17px}
.reply p+p{margin-top:13px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--t3);font-size:15px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);
  animation:p 1.4s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes p{0%,60%,100%{opacity:.25}30%{opacity:1}}

.more{margin-top:56px;border-top:1px solid var(--line);padding-top:28px}
.more summary{cursor:pointer;color:var(--t3);font-size:15px;list-style:none;
  display:flex;align-items:center;gap:8px}
.more summary::-webkit-details-marker{display:none}
.more summary:hover{color:var(--t1)}
.more summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;
  border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-left:2px}
.more[open] summary::after{transform:rotate(-135deg)}
.weeks{margin-top:26px;display:flex;align-items:flex-end;gap:5px;height:130px}
.wk{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;
  align-items:center;height:100%}
.wk b{width:100%;background:var(--line2);border-radius:4px 4px 0 0;display:block}
.wk.hot b{background:var(--accent)}
.wk span{font-size:10.5px;color:var(--t3);white-space:nowrap}
.cap{margin-top:16px;color:var(--t3);font-size:14.5px;line-height:1.55}
.cap b{color:var(--t1);font-weight:600}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <svg width="30" viewBox="0 0 48 19.27" fill="currentColor" aria-label="Grutto"><path id="bird" fill-rule="evenodd" d=""/></svg>
    Grutto
  </div>
  <button class="theme" id="theme">Light</button>
</header>

<main>
  <div class="tag" id="tag"><i></i><span>Rest day</span></div>
  <h1 id="verdict">Loading</h1>
  <div class="says" id="says"></div>

  <dl class="facts" id="facts"></dl>

  <div class="ask">
    <form id="askform">
      <input id="q" placeholder="Ask your coach something" autocomplete="off">
      <button id="send">Ask</button>
    </form>
    <div class="chips" id="chips"></div>
  </div>

  <div class="thread" id="thread"></div>

  <details class="more">
    <summary>Why, if you want the detail</summary>
    <div class="weeks" id="weeks"></div>
    <p class="cap" id="cap"></p>
    <p class="cap" style="margin-top:18px"><a href="detail.html" style="color:var(--t3)">
    Open the full record</a>, if you want every run, every week and every number.</p>
  </details>
</main>

</div>
<script>
const BIRD_D = window.__BIRD__ || "";
const $ = s => document.querySelector(s);

const FALLBACK = {runner:{name:"Bas",days_since_last_run:10,in_pain:true,pain_area:"both feet",
  goal_race:"Half marathon",weeks_to_race:2},chronic_km:12.72,ceiling_km:7.6,
  weeks:[],intensity:{easy_runs:1,runs_with_hr:21},race:{call:"do not race it"}};

let S = FALLBACK;

fetch("mark.svg").then(r=>r.text()).then(t=>{
  const m = t.match(/ d="([^"]+)"/); if(m) $("#bird").setAttribute("d", m[1]);
}).catch(()=>{});

$("#theme").onclick = () => {
  const l = document.documentElement.dataset.theme === "light";
  document.documentElement.dataset.theme = l ? "dark" : "light";
  $("#theme").textContent = l ? "Light" : "Dark";
};

function render(){
  const r = S.runner, hurt = r.in_pain;

  $("#tag").innerHTML = `<i></i><span>${hurt ? "Rest day" : "Today"}</span>`;
  $("#verdict").textContent = hurt ? "Don't run today." : "Easy run, 4 km.";

  $("#says").innerHTML = hurt ? `
    <p>Your feet have been sore for <strong>${r.days_since_last_run} days</strong> and you
    have not run since. That needs a physio to look at before you run on it again, not a
    smaller training week.</p>
    <p>When they clear you, we start again properly. Walking is fine in the meantime,
    as long as it does not hurt.</p>`
    : `<p>Keep it easy. You should be able to talk the whole way.</p>`;

  const f = [
    ["Days off", r.days_since_last_run, ""],
    ["Recent average", (+S.chronic_km).toFixed(1), "km a week"],
    ["First week back", (+S.ceiling_km).toFixed(1), "km at most"],
  ];
  $("#facts").innerHTML = f.map(([k,v,u],i)=>
    `<div class="fact${i===2?" hot":""}"><dt>${k}</dt><dd>${v}${u?` <small>${u}</small>`:""}</dd></div>`
  ).join("");

  $("#chips").innerHTML = [
    "Should I run the half marathon?",
    "Why do my feet hurt?",
    "What should I fix first?",
  ].map(c=>`<button class="chip">${c}</button>`).join("");
  document.querySelectorAll(".chip").forEach(c =>
    c.onclick = () => {
      if ($("#send").disabled) return;
      $("#q").value = c.textContent; $("#askform").requestSubmit();
    });

  const ws = S.weeks.filter(w=>w.km !== null);
  const max = Math.max(...ws.map(w=>w.km), 1);
  $("#weeks").innerHTML = ws.map(w=>{
    const hot = w.flag === "high";
    const h = Math.max(w.km / max * 100, 1.5);
    const M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const d = new Date(w.week_starting);
    const lab = `${d.getDate()} ${M[d.getMonth()]}`;
    return `<div class="wk${hot?" hot":""}" title="${w.km} km"><b style="height:${h}%"></b>
            <span>${lab}</span></div>`;
  }).join("");

  const bad = ws.filter(w=>w.flag==="high").length;
  $("#cap").innerHTML = `Each bar is a week. The <b>${bad} in orange</b> were more than
    double the four weeks before them. Your watch called all three of them optimal.`;
}

// deep link: /#why opens the evidence section
if (location.hash === "#why") document.querySelector(".more").open = true;

fetch("/api/state").then(r=>r.json()).then(d=>{S=d; render();})
  .catch(()=>{ render(); const t=document.querySelector(".tag");
    t.insertAdjacentHTML("beforeend",
      ' <span style="color:var(--t3);text-transform:none;letter-spacing:0;'
      + 'font-weight:400"> recorded data, server not running</span>'); });

// one session id for this browser, so follow-up questions continue the thread
const SESSION = localStorage.getItem("grutto-session")
  || (s => (localStorage.setItem("grutto-session", s), s))("web-" + Date.now());

const esc = s => s.replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

function bird(px){
  return `<svg width="${px}" viewBox="0 0 48 19.27" fill="currentColor">
    <path fill-rule="evenodd" d="${$("#bird").getAttribute("d")}"/></svg>`;
}

$("#askform").onsubmit = async e => {
  e.preventDefault();
  const q = $("#q").value.trim(); if(!q) return;
  $("#q").value = "";
  $("#send").disabled = true;

  const thread = $("#thread");
  thread.insertAdjacentHTML("beforeend", `<div class="you">You asked: <b>${esc(q)}</b></div>`);
  const card = document.createElement("div");
  card.className = "reply";
  card.innerHTML = `<div class="thinking"><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span> Your coach is looking at your runs</div>`;
  thread.appendChild(card);
  card.scrollIntoView({behavior:"smooth", block:"nearest"});

  try{
    const r = await fetch("/api/plan",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q, session_id:SESSION})});
    const d = await r.json();
    const text = (d.final||d.error||"Something went wrong.").trim();
    card.innerHTML = `<div class="who">${bird(17)} Your coach</div>`
      + text.split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join("");
  }catch(err){
    card.innerHTML = `<p>Could not reach your coach. Is the server running?</p>`;
  }
  $("#send").disabled = false;
  $("#q").placeholder = "Ask a follow up";
  $("#q").focus();
};
</script>
</body>
</html>
