<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Grutto">
  <!-- A grutto, the black-tailed godwit, at full stride.

       Godwits run on those long legs, and a running gait is a running gait.
       The split between the legs is what a runner reads first, and the bill
       longer than the head and neck is what makes it this bird rather than
       any bird. Uses currentColor so it inherits whatever it sits in. -->
  <g fill="currentColor">
    <path d="M5.0 27.2 C6.8 22.6 11.6 19.4 17.4 19.0
             C23.2 18.6 27.2 21.0 27.4 24.4
             C27.6 28.2 23.4 31.4 17.6 31.8
             C11.6 32.2 6.8 30.6 5.0 27.2 Z"/>
    <path d="M25.2 20.6 C27.0 17.4 29.0 14.4 30.6 12.2
             C31.2 11.3 33.1 12.5 32.5 13.4
             C31.0 15.6 29.2 18.4 27.6 21.4 Z"/>
    <circle cx="32.0" cy="11.2" r="2.4"/>
    <path d="M34.1 10.5 L45.6 13.2 C46.7 13.45 46.4 15.0 45.3 14.8
             L33.9 12.9 Z"/>
  </g>
  <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <path d="M22.6 31.0 L28.6 37.4 L31.8 43.4 L35.0 43.8"/>
    <path d="M13.6 31.4 L8.2 37.0 L3.2 41.6"/>
  </g>
</svg>
