<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Grutto">
  <!-- A godwit in flight, seen from below.

       Two proportions make it this bird and not a generic one: a bill longer
       than the head, and legs that trail past the tail. Everything else is
       stripped out so it still reads at 16 pixels.

       Uses currentColor, so it takes the colour of whatever it sits in. -->
