    <path d="M23.2 3.6 C23.2 2.5 24.8 2.5 24.8 3.6 L25.3 13.4 L22.7 13.4 Z"/>
    <path d="M22.7 13.2 C21.4 16.4 21.1 22.2 22.0 27.4
             C22.4 30.0 25.6 30.0 26.0 27.4
             C26.9 22.2 26.6 16.4 25.3 13.2 Z"/>
    <path d="M22.3 27.0 C21.0 30.2 20.6 33.4 21.1 35.6
             C21.4 36.9 26.6 36.9 26.9 35.6
             C27.4 33.4 27.0 30.2 25.7 27.0 Z"/>
    <path d="M23.3 34.4 C22.9 38.0 22.5 41.2 22.2 43.6
             C22.1 44.5 21.1 44.4 21.15 43.5
             C21.4 41.0 21.8 37.8 22.3 34.3 Z"/>
    <path d="M24.7 34.4 C25.1 38.0 25.5 41.2 25.8 43.6
             C25.9 44.5 26.9 44.4 26.85 43.5
             C26.6 41.0 26.2 37.8 25.7 34.3 Z"/>
    <g id="wing">
