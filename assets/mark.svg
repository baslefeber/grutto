<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 19.27" role="img" aria-label="Grutto">
  <!-- A grutto, the black-tailed godwit, running.

       The bird flies thirteen thousand kilometres without landing. The two
       things that make the silhouette this bird and not any bird are the bill,
       longer than the head and neck together, and the legs, long enough that a
       stride reads as a stride. Traced from a silhouette, not drawn by eye.

       Uses currentColor so it takes the colour of whatever it sits in. -->
